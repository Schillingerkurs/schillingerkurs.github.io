- id: mining-licenses-africa
  type: project
  title: Mining licenses in low income countries
  summary: >
    A comprehensive data repository of mining licenses across low-income countries, built with
    Alan Jones, uncovering formal and informal mining sites and shedding light on mine performance
    and ownership structures.
  description: >
    Natural resource extraction, particularly mining, holds paramount economic and political
    significance as it fuels economic expansion, facilitates employment opportunities and generates
    substantial revenue in many low income countries. At the same time these resources are crucial
    to the global supply chain of electronic devices. However, studying mining activities and
    comprehending their legal status empirically presents inherent challenges due to the intricacies
    of the industry, variations in legal frameworks across different jurisdictions, the prevalence of
    informal and illicit mining practices, limited transparency in reporting, and the involvement of
    numerous stakeholders. Consequently, the comprehensive collection and analysis of data become
    arduous tasks.

    In light of these challenges, in collaboration with Alan Jones, we have curated a comprehensive
    data repository of mining licenses in various low-income countries. This section presents
    descriptive statistics pertaining to the current project stages, shedding light on the prevailing
    conditions in the mining sector.

    ### Example: Mining activities and licenses in Sierra Leone

    The following interactive map zooms in on Sierra Leone and lists details of mining licenses and
    existing measures of mining activities.

    The listed categories include licenses for artisanal miner or small-scale mining (ASM),
    Exploration and Prospecting licenses as well as Production licenses.

    To compare these legal entities to actual mining, the map also plots mining areas defined by
    [Maus et al. (2020)](https://www.nature.com/articles/s41597-020-00624-w) and the
    [United States Geological Survey (USGS)](https://www.usgs.gov/). If you zoom in, you will also
    see mining areas that are mapped in the
    [OpenStreetMap (OSM)](https://www.openstreetmap.org/#map=14/-2.0182/29.3634) project.
  status: ongoing
  collaborators:
    - name: Alan Jones
      url: "https://www.linkedin.com/in/alanksjones/"
  images:
    - path: /image/data_projects/production_licenses_all.png
      caption: "Major extraction sides (blue) and public available mining licenses (red) on the African continent."
  embeds:
    - kind: iframe
      src: /files/maps/sle_production_licenses.html
      height: 600
      width: 800
  links:
    - label: "Maus et al. (2020)"
      url: "https://www.nature.com/articles/s41597-020-00624-w"
    - label: "United States Geological Survey (USGS)"
      url: "https://www.usgs.gov/"
    - label: "OpenStreetMap (OSM)"
      url: "https://www.openstreetmap.org/#map=14/-2.0182/29.3634"
  skills: [geospatial-analysis, data-visualization]
  dataset_id: mining-licenses-africa
  audience: [recruiter, academic, public]

- id: mines-roads-afghanistan
  type: project
  title: Mines and roads in Afghanistan
  summary: >
    Investigates how the Taliban's rent-capture activities shifted from ambush tactics to economic
    policy after becoming the incumbent power in Afghanistan since August 2021.
  description: >
    Any group that gains power over a land or territory faces changing requirements as incumbent.
    While rebel groups can rely on ambush tactics and capture rents from existing economic
    activities, incumbents need to carry out their own economic policy or attract foreign capital to
    finance their rule. Existing research examines rent capture practices by rebel groups and
    incumbents separately, but does not account for the way rent capture opportunities shift if a
    rebel group becomes the incumbent. To study this relation, this project investigates for the case
    of contemporary Afghanistan how the Taliban shifted their activities since August 2021.

    The figure below displays the road network and awarded mining licenses before and after August 2021.
  status: ongoing
  collaborators: []
  images:
    - path: /image/data_projects/mines_and_roads_AFG.png
      caption: "Road network and awarded mining licenses before and after August 2021."
  embeds: []
  links: []
  skills: [geospatial-analysis]
  dataset_id:
  audience: [academic, public]

- id: mozambique-formal-sector
  type: project
  title: The formal sector of Mozambique
  summary: >
    Parses unstructured text data on firm ownership from Mozambique's national gazette to build a
    1:1 ownership model of the country's formal private sector since independence.
  description: >
    The study of low income countries is complicated by the lack of readily available data on firms
    and their owners. To address this challenge, I parse unstructured text data on firm ownership
    from a national gazette of Mozambique containing all formally registered entries since
    Mozambique's independence.

    In the flow map below, I define the home district of each business owner as the first one where
    they register any entity in the gazette. If the same person registers an entity in another
    district, the flow level between these two districts increases by one unit. Overall, this model
    shows that the large gas discoveries in northern Mozambique primarily increased the economic
    connection and business owner migration between the capital Maputo and different districts. The
    FDI inflow, triggered by the gas discovery, relates to very little inter-district flows of
    business owners.
  status: ongoing
  collaborators: []
  images: []
  embeds:
    - kind: iframe
      src: "https://flowmap.blue/11ZnABzljcOILxtO64k7OcQVoshZ2vVrSM0ma6sq2hPo/embed"
      height: 800
      width: 600
  links: []
  skills: [text-parsing, data-visualization, network-analysis]
  dataset_id:
  audience: [academic, public]

- id: rare-earth-africa
  type: project
  title: Rare earth in Africa
  summary: >
    Maps rare earth mining licenses, deposits and production sites across Africa, compiled from
    national cadastres and USGS data.
  description: >
    This map lists all rare earth mining licenses (red), deposits (brown) and production sides
    (black) that I found in my mining data repositories.

    The licenses are from each country's online cadastre (if a country has one); the deposits and
    production sides (n = 2) are from
    [USGS](https://www.usgs.gov/centers/national-minerals-information-center/rare-earths-statistics-and-information).
